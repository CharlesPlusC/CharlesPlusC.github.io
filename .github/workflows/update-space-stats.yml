name: Update Space Stats

on:
  schedule:
    # Run once a day, after the CelesTrak catalogue refresh
    - cron: '30 4 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-space-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build space stats from CelesTrak SATCAT
        run: python3 scripts/build_space_stats.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/space-stats.json

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to space stats"
          else
            git commit -m "Update space stats [automated]"
            git push
            echo "✓ Pushed updated space stats"
          fi
